services:
  db:
    build:
      - context: ./database
      - dockerfile: Dockefile
    container_name: todo_db
    hostname: todo_host
    ports:
      - '5432:5432'
    restart: always
    environment:
      - POSTGRES_USER=${PG_USER_NAME}
      - POSTGRES_PASSWORD=${PG_USER_PASS}
      - TZ: 'Asia/Tokyo'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER_NAME} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_vol:/var/lib/postgresql

volumes:
  db_vol:
